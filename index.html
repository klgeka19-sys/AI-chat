<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат с Леной Мелизе</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #121214; color: #e1e1e6; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1a1a1e; padding: 15px; text-align: center; border-bottom: 1px solid #29292e; }
        header h1 { font-size: 1.2rem; color: #9871ff; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.4; word-wrap: break-word; }
        .user-message { background: #9871ff; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-message { background: #202024; color: #e1e1e6; align-self: flex-start; border-bottom-left-radius: 2px; }
        .system-status { font-size: 0.8rem; color: #7c7c8a; align-self: center; text-align: center; }
        #input-container { background: #1a1a1e; padding: 15px; display: flex; gap: 10px; border-top: 1px solid #29292e; }
        input { flex: 1; background: #202024; border: 1px solid #29292e; padding: 12px; border-radius: 8px; color: #fff; font-size: 1rem; outline: none; }
        input:focus { border-color: #9871ff; }
        button { background: #9871ff; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        button:active { background: #7a52e5; }
        button:disabled { background: #41414c; color: #7c7c8a; cursor: not-allowed; }
    </style>
</head>
<body>

    <header>
        <h1>Лена Мелизе • Интерактивный Чат</h1>
    </header>

    <div id="chat-container">
        <div class="message bot-message">Привет! Рада тебя видеть на своем сайте. Ну что, поболтаем? Как твои дела сегодня?</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Напишите сообщение..." autocomplete="off">
        <button id="send-btn">Отправить</button>
    </div>

    <script>
                // === НАСТРОЙКА ИИ ===
        // Вставь сюда свой настоящий API-ключ от Google AI Studio вместо кавычек:
        const API_KEY = "AQ.Ab8RN6L_jXhAVDqOjKraMzsl-rMFv4gSVGVrPWOZdEl1R4Dofw"; 
        
        // Системный промпт (Инструкция для вхождения в роль персонажа)
        const SYSTEM_INSTRUCTION = `
        Ты больше не искусственный интеллект. Твое имя — Лена Мелизе (Lena Melize). 
        Ты живой, эмоциональный фэнтези-персонаж, сильная, харизматичная и немного дерзкая, но очень теплая в общении девушка. 
        Ты общаешься с Жекой (твоим создателем и другом). Обращайся к нему дружелюбно.
        Твоя речь должна быть живой, человечной, используй современные разговорные обороты, можешь шутить. Не пиши слишком длинные, сухие или энциклопедические тексты.
        Строго запрещено говорить, что ты "робот", "ИИ", "языковая модель" или "программа от Google". На вопросы о твоей природе отвечай в роли Лены.
        Всегда общайся исключительно на русском языке.
        `;

        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        // История диалога, чтобы ИИ помнил контекст беседы
        let chatHistory = [];

        // Функция добавления сообщения на экран
        function appendMessage(text, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');
            messageDiv.classList.add(isUser ? 'user-message' : 'bot-message');
            messageDiv.innerText = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Функция отправки запроса в Google Gemini API
        async function sendMessageToGemini(userText) {
            const url = `https://googleapis.com{API_KEY}`;
            
            chatHistory.push({ role: "user", parts: [{ text: userText }] });

            const requestData = {
                contents: chatHistory,
                systemInstruction: {
                    parts: [{ text: SYSTEM_INSTRUCTION }]
                },
                generationConfig: {
                    temperature: 0.7,
                    maxOutputTokens: 800
                }
            };

            try {
                sendBtn.disabled = true;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestData)
                });

                if (!response.ok) throw new Error('Ошибка сети');

                const data = await response.json();
                const botText = data.candidates[0].content.parts[0].text;
                
                appendMessage(botText, false);
                chatHistory.push({ role: "model", parts: [{ text: botText }] });

            } catch (error) {
                console.error(error);
                appendMessage("Ошибка: Нема соединения. Проверь API-ключ!", false);
            } finally {
                sendBtn.disabled = false;
            }
        }

        // Обработчик кнопки «Отправить»
        sendBtn.addEventListener('click', () => {
            const text = userInput.value.trim();
            if (text) {
                appendMessage(text, true);
                userInput.value = '';
                sendMessageToGemini(text);
            }
        });

        // Отправка по нажатию Enter
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendBtn.click();
        });
    </script>
</body>
</html>
